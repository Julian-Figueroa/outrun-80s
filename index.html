<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#05010f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Sunset Run</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05010f;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100dvh;
        display: block;
        touch-action: none;
      }
      #touch {
        display: none;
      }
      @media (pointer: coarse) {
        #touch {
          display: block;
        }
      }
      #touch .cluster {
        position: fixed;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 4vmin);
        display: flex;
        gap: 3vmin;
      }
      #touch .steer {
        left: calc(env(safe-area-inset-left, 0px) + 4vmin);
      }
      #touch .pedals {
        right: calc(env(safe-area-inset-right, 0px) + 4vmin);
      }
      #touch .sys {
        left: 50%;
        transform: translateX(-50%);
      }
      #touch button {
        width: 19vmin;
        height: 19vmin;
        border-radius: 50%;
        border: 2px solid rgba(5, 217, 232, 0.8);
        background: rgba(20, 4, 40, 0.35);
        color: #d8f6ff;
        font: 800 italic 3.4vmin Orbitron, 'Trebuchet MS', sans-serif;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #touch .pedals button {
        border-color: rgba(255, 42, 109, 0.85);
      }
      #touch .pedals .gas {
        width: 23vmin;
        height: 23vmin;
      }
      #touch .sys button {
        width: 10vmin;
        height: 10vmin;
        font-size: 3vmin;
        opacity: 0.7;
      }
      #touch button.on {
        background: rgba(255, 42, 109, 0.45);
        box-shadow: 0 0 3vmin rgba(255, 42, 109, 0.8);
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="touch">
      <div class="cluster steer">
        <button data-key="left" aria-label="Steer left">◀</button>
        <button data-key="right" aria-label="Steer right">▶</button>
      </div>
      <div class="cluster sys">
        <button data-action="pause" aria-label="Pause">II</button>
        <button data-action="mute" aria-label="Mute">♪</button>
      </div>
      <div class="cluster pedals">
        <button data-key="slower" aria-label="Brake">BRK</button>
        <button data-key="faster" class="gas" aria-label="Gas">GAS</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
